name: build-b906-kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-14.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout build repo (patch files)
        uses: actions/checkout@v4
        with:
          path: b906build

      - name: Checkout upstream kernel (fresh download, lineage-15.1 = kernel 3.10.108)
        uses: actions/checkout@v4
        with:
          repository: DeVviL/android_kernel_mediatek_giraffe
          ref: lineage-15.1
          fetch-depth: 1
          path: kernel

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc git bzip2 xz-utils libssl-dev cpio curl python3
          sudo apt-get install -y -qq libncurses6 libtinfo6 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6   /usr/lib/x86_64-linux-gnu/libtinfo.so.5   || true
          gcc --version | head -1

      - name: Fetch arm-eabi toolchain (multi-source fallback)
        run: |
          set -uo pipefail
          cd $GITHUB_WORKSPACE
          rm -rf toolchain tc_tmp tcx

          try_git() {
            echo "== [git] $1"
            rm -rf tc_tmp
            if git clone --depth=1 "$1" tc_tmp >/dev/null 2>&1 && [ -x tc_tmp/bin/arm-eabi-gcc ]; then
              mv tc_tmp toolchain; return 0
            fi
            rm -rf tc_tmp; return 1
          }
          try_tgz() {
            echo "== [tgz] $1"
            rm -rf tcx; mkdir -p tcx
            if curl -fL --retry 3 --connect-timeout 20 -o /tmp/tc.tar.gz "$1" >/dev/null 2>&1; then
              if tar -xzf /tmp/tc.tar.gz -C tcx 2>/dev/null && [ -x tcx/bin/arm-eabi-gcc ]; then
                mv tcx toolchain; return 0
              fi
            fi
            rm -rf tcx; return 1
          }
          try_tar() {
            echo "== [tar] $1"
            rm -rf tcx; mkdir -p tcx
            if curl -fL --retry 3 --connect-timeout 20 -o /tmp/tc.tar.xz "$1" >/dev/null 2>&1; then
              if tar -xJf /tmp/tc.tar.xz -C tcx --strip-components=1 2>/dev/null && [ -x tcx/bin/arm-eabi-gcc ]; then
                mv tcx toolchain; return 0
              fi
            fi
            rm -rf tcx; return 1
          }

          try_git https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 \
          || try_tgz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8/+archive/refs/heads/master.tar.gz \
          || try_git https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.8 \
          || try_git https://github.com/omnirom/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.8 \
          || try_tar https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-eabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-eabi.tar.xz \
          || try_tar https://snapshots.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-eabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-eabi.tar.xz \
          || true

          if [ ! -x $GITHUB_WORKSPACE/toolchain/bin/arm-eabi-gcc ]; then
            echo "::error::TOOLCHAIN FETCH FAILED - all sources exhausted"
            exit 1
          fi
          echo "TOOLCHAIN OK:"
          $GITHUB_WORKSPACE/toolchain/bin/arm-eabi-gcc --version | head -1

      - name: Apply b906 LCM driver + lcm list
        working-directory: kernel
        run: |
          set -euo pipefail
          LCM=arch/arm/mach-mt6582/alps/lcm
          mkdir -p "$LCM"
          cp $GITHUB_WORKSPACE/b906build/patch/ek79007_wxga_dsi_vdo_b906.c "$LCM/"
          cp $GITHUB_WORKSPACE/b906build/patch/lcm_Makefile              "$LCM/Makefile"
          cp $GITHUB_WORKSPACE/b906build/patch/mt65xx_lcm_list.c         "$LCM/mt65xx_lcm_list.c"
          echo "---- lcm dir ----"; ls -l "$LCM" | head -20
          echo "---- driver head ----"; head -12 "$LCM/ek79007_wxga_dsi_vdo_b906.c"

      - name: Create b906_defconfig
        working-directory: kernel
        run: |
          set -euo pipefail
          C=arch/arm/configs
          cp $C/zera_defconfig $C/b906_defconfig
          sed -i 's|^CONFIG_CUSTOM_KERNEL_LCM=.*|CONFIG_CUSTOM_KERNEL_LCM="ek79007_wxga_dsi_vdo_b906"|' $C/b906_defconfig
          sed -i 's|^CONFIG_LCM_WIDTH=.*|CONFIG_LCM_WIDTH="720"|' $C/b906_defconfig
          sed -i 's|^CONFIG_LCM_HEIGHT=.*|CONFIG_LCM_HEIGHT="1280"|' $C/b906_defconfig
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=.*|# CONFIG_LOCALVERSION_AUTO is not set|' $C/b906_defconfig
          grep -q '^CONFIG_ANDROID_BINDER_DEVICES=' $C/b906_defconfig \
            || echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> $C/b906_defconfig
          grep -q '^CONFIG_ANDROID_BINDER_IPC=y' $C/b906_defconfig \
            || echo 'CONFIG_ANDROID_BINDER_IPC=y' >> $C/b906_defconfig

          # 诊断用：把内核日志打到屏幕上（framebuffer console）
          set_config() {
            key=$1; val=$2
            if grep -q "^$key=" $C/b906_defconfig; then
              sed -i "s|^$key=.*|$key=$val|" $C/b906_defconfig
            elif grep -q "^# $key is not set" $C/b906_defconfig; then
              sed -i "s|^# $key is not set|$key=$val|" $C/b906_defconfig
            else
              echo "$key=$val" >> $C/b906_defconfig
            fi
          }
          set_config CONFIG_DEVTMPFS y
          set_config CONFIG_DEVTMPFS_MOUNT y
          set_config CONFIG_VT y
          set_config CONFIG_VT_HW_CONSOLE_BINDING y
          set_config CONFIG_VT_CONSOLE y
          set_config CONFIG_DUMMY_CONSOLE y
          set_config CONFIG_FRAMEBUFFER_CONSOLE y
          set_config CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY y
          set_config CONFIG_FONTS y
          set_config CONFIG_FONT_8x16 y
          set_config CONFIG_LOGO n
          echo "==== console config ===="
          grep -E "CONFIG_VT=|CONFIG_VT_HW_CONSOLE_BINDING|CONFIG_FRAMEBUFFER_CONSOLE|CONFIG_FONT_8x16|CONFIG_DUMMY_CONSOLE" $C/b906_defconfig

      - name: Patch vc_screen for VT (fixed_size_llseek missing in this tree)
        working-directory: kernel
        run: |
          set -euo pipefail
          F=drivers/tty/vt/vc_screen.c
          if [ ! -f "$F" ]; then echo "no vc_screen.c, skip"; exit 0; fi
          if grep -q b906_fixed_size_llseek "$F"; then echo "already patched"; exit 0; fi

          cat > helper_vt.c <<'EOF_HELPER'
          /* this kernel tree removed fixed_size_llseek (unused while VT disabled) */
          static loff_t b906_fixed_size_llseek(struct file *file, loff_t offset, int whence, loff_t size)
          {
              switch (whence) {
              case SEEK_SET:
                  break;
              case SEEK_CUR:
                  offset += file->f_pos;
                  break;
              case SEEK_END:
                  offset += size;
                  break;
              default:
                  return -EINVAL;
              }
              if (offset < 0 || offset > size)
                  return -EINVAL;
              file->f_pos = offset;
              return file->f_pos;
          }

          EOF_HELPER

          cat > patch_vt.py <<'EOF_PY'
          path = "drivers/tty/vt/vc_screen.c"
          src = open(path).read()
          helper = open("helper_vt.c").read()
          src = src.replace("fixed_size_llseek(", "b906_fixed_size_llseek(")
          idx = 0
          for m in __import__("re").finditer(r"^#include .*$", src, __import__("re").M):
              idx = m.end()
          src = src[:idx] + chr(10) + helper + src[idx:]
          open(path, "w").write(src)
          print("patched", path)
          EOF_PY

          python3 patch_vt.py
          grep -n "b906_fixed_size_llseek" $F | head -5
          rm -f helper_vt.c patch_vt.py

      - name: Patch vt.c (take_over_console wrapper missing)
        working-directory: kernel
        run: |
          set -euo pipefail
          F=drivers/tty/vt/vt.c
          [ -f "$F" ] || { echo "no vt.c, skip"; exit 0; }
          if grep -q "^int take_over_console" "$F"; then echo "already patched"; exit 0; fi

          cat > wrap_toc.c <<'EOF_WRAP'

          /*
           * this tree dropped the locking wrapper (VT was disabled); fbcon.c still calls it
           */
          int take_over_console(const struct consw *csw, int first, int last, int deflt)
          {
              int err;

              console_lock();
              err = do_take_over_console(csw, first, last, deflt);
              console_unlock();

              return err;
          }
          EXPORT_SYMBOL(take_over_console);
          EOF_WRAP

          cat > patch_vt2.py <<'EOF_PY'
          path = "drivers/tty/vt/vt.c"
          src = open(path).read()
          marker = "EXPORT_SYMBOL_GPL(do_take_over_console);"
          idx = src.find(marker)
          assert idx > 0
          ins = open("wrap_toc.c").read()
          src = src[:idx + len(marker)] + ins + src[idx + len(marker):]
          open(path, "w").write(src)
          print("patched", path)
          EOF_PY

          python3 patch_vt2.py
          grep -n "^int take_over_console" $F
          rm -f patch_vt2.py wrap_toc.c

      - name: Patch mtkfb (cmdline switch to skip display init)
        working-directory: kernel
        run: |
          set -euo pipefail
          F=drivers/misc/mediatek/video/mtkfb.c
          [ -f "$F" ] || { echo "no mtkfb.c, skip"; exit 0; }
          if grep -q b906_mtkfb_off "$F"; then echo "already patched"; exit 0; fi

          cat > patch_fb.py <<'EOF_PY'
          path = "drivers/misc/mediatek/video/mtkfb.c"
          src = open(path).read()
          anchor = "int __init mtkfb_init(void)"
          idx = src.find(anchor)
          assert idx > 0
          hook = '''
          #include <linux/init.h>
          #include <linux/string.h>

          static int b906_mtkfb_off;
          static int __init b906_mtkfb_setup(char *str)
          {
              if (str && (str[0] == '0' || str[0] == 'o'))
                  b906_mtkfb_off = 1;
              return 1;
          }
          __setup("mtkfb=", b906_mtkfb_setup);

          '''
          src = src[:idx] + hook + src[idx:]
          old = "int __init mtkfb_init(void)" + chr(10) + "{" + chr(10) + "    int r = 0;"
          q = chr(34)
          add = (chr(10) + "    if (b906_mtkfb_off) {" + chr(10)
                 + "        printk(KERN_INFO " + q + "b906: display init skipped" + q + ");" + chr(10)
                 + "        return 0;" + chr(10) + "    }")
          assert old in src
          src = src.replace(old, old + add, 1)
          open(path, "w").write(src)
          print("patched", path)
          EOF_PY

          python3 patch_fb.py
          grep -n b906_mtkfb_off $F | head -5
          rm -f patch_fb.py

      - name: Patch init/main.c (add noinit= initcall blacklist)
        working-directory: kernel
        run: |
          set -euo pipefail
          F=init/main.c
          [ -f "$F" ] || { echo "no main.c, skip"; exit 0; }
          if grep -q b906_noinit "$F"; then echo "already patched"; exit 0; fi

          cat > patch_init.py <<'EOF_PY'
          path = "init/main.c"
          src = open(path).read()
          T = chr(9)
          NL = chr(10)
          L = []
          L.append("static char b906_noinit[256];")
          L.append("")
          L.append("static int __init b906_noinit_setup(char *str)")
          L.append("{")
          L.append(T + "if (str)")
          L.append(T + T + "strlcpy(b906_noinit, str, sizeof(b906_noinit));")
          L.append(T + "return 1;")
          L.append("}")
          L.append("__setup(" + chr(34) + "noinit=" + chr(34) + ", b906_noinit_setup);")
          L.append("")
          L.append("static int b906_noinit_level = -1;")
          L.append("")
          L.append("static int __init b906_noinit_level_setup(char *str)")
          L.append("{")
          L.append(T + "if (str)")
          L.append(T + T + "b906_noinit_level = simple_strtoul(str, NULL, 0);")
          L.append(T + "return 1;")
          L.append("}")
          L.append("__setup(" + chr(34) + "noinit_level=" + chr(34) + ", b906_noinit_level_setup);")
          L.append("")
          L.append("")
          L.append("static int b906_idx_from = -1;")
          L.append("static int b906_idx_to = -1;")
          L.append("")
          L.append("static int __init b906_idx_from_setup(char *str)")
          L.append("{")
          L.append(T + "b906_idx_from = simple_strtoul(str, NULL, 0);")
          L.append(T + "return 1;")
          L.append("}")
          L.append("__setup(" + chr(34) + "noinit_idx_from=" + chr(34) + ", b906_idx_from_setup);")
          L.append("")
          L.append("static int __init b906_idx_to_setup(char *str)")
          L.append("{")
          L.append(T + "b906_idx_to = simple_strtoul(str, NULL, 0);")
          L.append(T + "return 1;")
          L.append("}")
          L.append("__setup(" + chr(34) + "noinit_idx_to=" + chr(34) + ", b906_idx_to_setup);")
          L.append("")
          L.append("")
          L.append("static int b906_initcall_skip(initcall_t fn)")
          L.append("{")
          L.append(T + "char name[96];")
          L.append(T + "char *p, *tok;")
          L.append(T + "unsigned long len;")
          L.append("")
          L.append(T + "if (!b906_noinit[0])")
          L.append(T + T + "return 0;")
          L.append("")
          L.append(T + "sprint_symbol(name, (unsigned long)fn);")
          L.append(T + "p = strchr(name, " + chr(39) + "+" + chr(39) + ");")
          L.append(T + "if (p)")
          L.append(T + T + "*p = 0;")
          L.append("")
          L.append(T + "tok = b906_noinit;")
          L.append(T + "while (tok && *tok) {")
          L.append(T + T + "p = strchr(tok, " + chr(39) + "," + chr(39) + ");")
          L.append(T + T + "len = p ? (unsigned long)(p - tok) : strlen(tok);")
          L.append(T + T + "if (len && strlen(name) == len && !strncmp(tok, name, len))")
          L.append(T + T + T + "return 1;")
          L.append(T + T + "tok = p ? p + 1 : NULL;")
          L.append(T + "}")
          L.append(T + "return 0;")
          L.append("}")
          hook = NL.join(L) + NL
          anchor = "static char msgbuf[64];"
          idx = src.find(anchor)
          assert idx > 0
          idx = idx + len(anchor)
          src = src[:idx] + NL + hook + src[idx:]
          old2 = T + "initcall_t *fn;"
          assert old2 in src
          src = src.replace(old2, old2 + NL + T + "int n = 0;", 1)

          old = "for (fn = initcall_levels[level]; fn < initcall_levels[level+1]; fn++)" + NL + T + T + "do_one_initcall(*fn);"
          new = ("if (level == b906_noinit_level)" + NL + T + T + "return;" + NL
                 + T + T + "for (fn = initcall_levels[level]; fn < initcall_levels[level+1]; fn++) {" + NL
                 + T + T + "int skip = 0;" + NL
                 + T + T + "if (level == 6 && b906_idx_from >= 0 && n >= b906_idx_from &&" + NL
                 + T + T + T + "(b906_idx_to < 0 || n < b906_idx_to))" + NL
                 + T + T + T + "skip = 1;" + NL
                 + T + T + "n++;" + NL
                 + T + T + "if (skip || b906_initcall_skip(*fn))" + NL
                 + T + T + T + "continue;" + NL
                 + T + T + "do_one_initcall(*fn);" + NL
                 + T + "}")
          assert old in src
          src = src.replace(old, new, 1)
          open(path, "w").write(src)
          print("patched", path)
          EOF_PY

          python3 patch_init.py
          grep -n b906_initcall_skip $F | head -5
          rm -f patch_init.py

      - name: Configure (.config)
        working-directory: kernel
        run: |
          set -euo pipefail
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE b906_defconfig 2>&1 | tail -12
          echo "==== key config ===="
          grep -E '^CONFIG_VT|^CONFIG_HW_CONSOLE|^CONFIG_FRAMEBUFFER_CONSOLE|^CONFIG_FONT_8x16|^CONFIG_DEVTMPFS' .config || true
          grep -E 'CONFIG_ANDROID_BINDER|CONFIG_CUSTOM_KERNEL_LCM|CONFIG_LCM_WIDTH|CONFIG_LCM_HEIGHT' .config || true

      - name: Build zImage
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-
          make -k -j$(nproc) ARCH=arm CROSS_COMPILE=$CROSS_COMPILE zImage KCFLAGS=-Wno-error 2>&1 | tee ../build.log | tail -200

      - name: Result
        if: always()
        run: |
          if [ -f kernel/arch/arm/boot/zImage ]; then
            echo "OK zImage"; ls -l kernel/arch/arm/boot/zImage
          else
            echo "zImage NOT generated"
            if [ -f build.log ]; then
              echo "========== ERROR SUMMARY =========="
              grep -nE "error:|Error [0-9]+|No rule to make" build.log | head -40 || true
              echo "========== TAIL =========="
              tail -40 build.log
            fi
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b906-zImage
          path: |
            kernel/arch/arm/boot/zImage
            kernel/arch/arm/boot/Image
            kernel/System.map
            kernel/.config
            build.log
          if-no-files-found: warn
          retention-days: 14
